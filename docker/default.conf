server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"Loved-IT web container"}';
    }

    # Same-origin proxy: tokens stay in requests, never in the image or build arguments.
    location /api/ {
        proxy_pass https://api.loved-it.shop;
        proxy_ssl_server_name on;
        proxy_set_header Host api.loved-it.shop;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location = /download/version.json {
        return 302 https://fls-a3256292-20b2-4e71-9420-0c178fc37586.laravel.cloud/download/releases/26111502/version.json;
    }
    location = /download/loved-it.apk {
        return 302 https://fls-a3256292-20b2-4e71-9420-0c178fc37586.laravel.cloud/download/loved-it-26111502.apk;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
