name: loved_it
description: "Loved-IT for Android: the buyer, rider and logistics app on the same API as loved-it.shop."
publish_to: 'none'

# build-name is Android's versionName and build-number its versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  cached_network_image: ^4.0.5
  dart_pusher_channels: ^1.3.1
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2
  go_router: ^18.1.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  latlong2: ^0.10.1
  lucide_icons_flutter: ^4.0.1
  mobile_scanner: ^7.4.2
  permission_handler: ^13.0.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Material widgets (date picker, back arrows) still draw a few Material icons; our own icons are Lucide.
  uses-material-design: true

  assets:
    # The website's logo (frontend/src/assets/branding/loved-it-logo-full-on-light.png).
    - assets/branding/loved-it-logo.png
    # The website's category photos (frontend/src/assets/categories/photos), 400 x 400; sources in CREDITS.md.
    - assets/categories/
    # The website's hero banner pictures (frontend/src/assets/hero).
    - assets/hero/

  # Inter, the website's font, bundled so text looks the same with no internet (SIL OFL, assets/fonts/OFL.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
