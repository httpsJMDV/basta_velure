name: Loved-IT CI-CD Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loved-it-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: velure_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: velure_test
      DB_USERNAME: root
      DB_PASSWORD: ci-test-only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BROADCAST_CONNECTION: 'null'
      AI_PRODUCT_CHECK: 'false'
      AI_SUPPORT_BOT: 'false'
      GROQ_API_KEY: ''
      ANTHROPIC_API_KEY: ''
      VITE_API_URL: /api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Run automated storefront tests
        working-directory: frontend
        run: npm test
      - name: Verify demonstration secret configuration
        # Fork PRs cannot access repository secrets. They still run all code checks.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -n "$DEMO_API_KEY" ]; then
            echo "Secret successfully configured."
          else
            echo "DEMO_API_KEY is missing. Configure the classroom dummy secret."
            exit 1
          fi
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, gd, intl, exif, zip
          coverage: none
          tools: composer:v2
      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Check PHP syntax
        working-directory: backend
        run: find app bootstrap config database/migrations routes tests -name '*.php' -print0 | xargs -0 -n1 php -l > /tmp/loved-it-php-lint.log
      - name: Prepare isolated CI test database
        working-directory: backend
        run: |
          test "$DB_DATABASE" = "velure_test"
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=CategorySeeder --force --no-interaction
      - name: Run full Laravel regression suite
        working-directory: backend
        run: php artisan test --compact --log-junit=storage/logs/junit.xml
      - name: Build application
        working-directory: frontend
        run: npm run build
      - name: Upload application build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loved-it-ci-evidence-${{ github.run_id }}
          path: |
            frontend/dist/
            backend/storage/logs/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker build, publish and verify
    needs: ci
    # Only trusted main/version-tag events publish. PRs never log in or push images.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/httpsjmdv/basta_velure
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=long
      - name: Build Docker image for runtime verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: loved-it-ci:tested
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container before publishing
        run: |
          trap 'docker logs loved-it-built || true' ERR
          docker run -d --name loved-it-built -p 3000:8080 loved-it-ci:tested
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:3000/healthz
          curl --fail http://localhost:3000/ci-status.json | tee /tmp/loved-it-status.json
          node -e 'const a=require("node:assert/strict"),s=require("/tmp/loved-it-status.json");a.equal(s.application,"Loved-IT");a.ok(s.message);'
          curl --fail http://localhost:3000/products/133 | grep -q 'id="root"'
          docker rm -f loved-it-built
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag loved-it-ci:tested "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Pull and run the published image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          trap 'docker logs loved-it-published || true' ERR
          image=$(printf '%s\n' "$IMAGE_TAGS" | head -n1)
          docker image rm "$image"
          docker pull "$image"
          docker run -d --name loved-it-published -p 3001:8080 "$image"
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:3001/healthz
          curl --fail http://localhost:3001/ci-status.json
          curl --fail http://localhost:3001/settings/profile | grep -q 'id="root"'
          docker rm -f loved-it-published
          {
            echo '## Published and runtime-verified Loved-IT container'
            echo 'The exact image passed HTTP health, release-output and SPA-route checks before publication.'
            echo 'It was then pulled from GHCR and run again on port 3001.'
            printf '\n```text\n%s\n```\n' "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record published package metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/users/httpsJMDV/packages/container/basta_velure \
            > /tmp/loved-it-package.json
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            'https://api.github.com/users/httpsJMDV/packages/container/basta_velure/versions?per_page=10' \
            > /tmp/loved-it-package-versions.json
          jq '{name, package_type, visibility, html_url, version_count}' /tmp/loved-it-package.json
          jq '[.[] | {digest: .name, tags: .metadata.container.tags}]' /tmp/loved-it-package-versions.json
      - name: Upload registry evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: loved-it-ghcr-evidence-${{ github.run_id }}
          path: |
            /tmp/loved-it-package.json
            /tmp/loved-it-package-versions.json
          retention-days: 7
